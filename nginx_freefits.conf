# FreeFits — nginx behind AWS (ACM on ALB / CloudFront)
#
# ACM certificates are not installed here; HTTPS terminates upstream. This
# instance should only accept HTTP from your load balancer / CloudFront origin.
#
# Optional: trust client IPs from your VPC (replace with your VPC CIDR) so logs
# show real visitors instead of the load balancer:
#   real_ip_header X-Forwarded-For;
#   real_ip_recursive on;
#   set_real_ip_from 10.0.0.0/8;

# Use X-Forwarded-Proto from the load balancer when present (HTTPS at edge).
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

server {
    listen 80;
    listen [::]:80;
    server_name free-fits.com www.free-fits.com;

    client_max_body_size 10M;

    access_log /var/log/nginx/freefits_access.log;
    error_log /var/log/nginx/freefits_error.log;

    server_tokens off;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;

        proxy_hide_header Cache-Control;
        proxy_hide_header Server;
        add_header Server "" always;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: https://*.s3.amazonaws.com https://*.amazonaws.com; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; font-src 'self' data:; connect-src 'self' https://nominatim.openstreetmap.org https://geocoder.ca https://maps.googleapis.com;" always;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    location = /favicon.ico {
        alias /home/ubuntu/FreeFits/app/static/images/headerlogo.png;
        add_header Cache-Control "public, max-age=86400";
    }

    location /static {
        alias /home/ubuntu/FreeFits/app/static;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}