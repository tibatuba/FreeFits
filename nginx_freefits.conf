# HTTP server - redirect to HTTPS
server {
    listen 80;
    server_name free-fits.com www.free-fits.com;
    return 301 https://$server_name$request_uri;
}

# HTTPS server
server {
    listen 443 ssl http2;
    server_name free-fits.com www.free-fits.com;

    # SSL certificates (Certbot manages these)
    ssl_certificate /etc/letsencrypt/live/free-fits.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/free-fits.com/privkey.pem;

    # SSL configuration
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers ECDHE-RSA-AES256-GCM-SHA512:DHE-RSA-AES256-GCM-SHA512:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES256-GCM-SHA384;

    # Increase body size limit for image uploads (10MB)
    client_max_body_size 10M;

    # Logging
    access_log /var/log/nginx/freefits_access.log;
    error_log /var/log/nginx/freefits_error.log;

    # Proxy settings
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Ensure HTML/app responses are not cached so deploys show immediately
        proxy_hide_header Cache-Control;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;

        # WebSocket support (if needed in future)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Serve static files directly (optional, for better performance)
    location /static {
        alias /home/ubuntu/FreeFits/app/static;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Security headers - Enhanced protection against common attacks
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    
    # Content Security Policy - Prevents XSS attacks
    # Allows same-origin resources, S3 images, and common CDNs
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: https://*.s3.amazonaws.com https://*.amazonaws.com; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; font-src 'self' data:; connect-src 'self' https://nominatim.openstreetmap.org https://geocoder.ca;" always;
    
    # Hide Nginx version (security through obscurity)
    server_tokens off;
}



