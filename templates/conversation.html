{% extends 'base.html' %}
{% block content %}
<h2 class="mb-3">Chat with {{ convo.with }}</h2>
<div class="card">
  <div class="card-body" style="min-height: 320px;">
    {% for m in convo.messages %}
      <div class="d-flex {% if m.sender=='You' %}justify-content-end{% else %}justify-content-start{% endif %} mb-2">
        <div class="px-3 py-2 rounded-3 {% if m.sender=='You' %}bg-primary text-white{% else %}bg-light{% endif %}">
          <small class="d-block fw-bold">{{ m.sender }}</small>
          <span>{{ m.text }}</span>
        </div>
      </div>
    {% endfor %}
  </div>
  <div class="card-footer">
    <div class="input-group">
      <input type="text" class="form-control" placeholder="Type a message (mock only)">
      <button class="btn btn-secondary" type="button" disabled>Send</button>
    </div>
    <small class="text-muted">Note: This is a mock UI; sending is disabled in the inception increment.</small>
  </div>
</div>
{% endblock %}
