<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home - My Flask App</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <header>
        <h1>My Flask App</h1>
    </header>

    <main>
        <h2>Welcome to my Flask app!</h2>
        {% if username %}
            <p>Hello, {{ username }}! You are logged in.</p>
            <a href="{{ url_for('main.logout') }}">Logout</a>
        {% else %}
            <p>You are not logged in. Please <a href="{{ url_for('main.login') }}">login</a></p>
        {% endif %}
        <p>This is a simple home page. You can add more pages and links in your routes.</p>
        <a href="#">Learn more</a>
    </main>

    <footer>
        &copy; 2025 My Flask App
    </footer>
</body>
</html>
