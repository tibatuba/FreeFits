<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Report listing - FreeFits</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}?v=4">
</head>
<body>
    <header>
        <div class="header-content">
            <h1 class="site-logo">
                <a href="{{ url_for('main.home') }}" class="logo-link">
                    <img src="{{ url_for('static', filename='images/headerlogo.png') }}" alt="FreeFits Logo" class="logo-img">
                </a>
            </h1>
            <nav class="user-nav">
                <span class="welcome">Welcome, {{ username }}!</span>
                <a href="{{ url_for('main.my_listings') }}" class="nav-link">My Listings</a>
                <a href="{{ url_for('main.logout') }}" class="nav-link">Logout</a>
            </nav>
        </div>
    </header>

    <main style="max-width: 560px; margin: 2rem auto; padding: 0 1rem;">
        <h2>Report this listing</h2>
        <p><strong>{{ listing.title }}</strong></p>
        <p class="muted">Your report will be reviewed by moderators. Only use this for listings that violate community guidelines.</p>

        <form action="{{ url_for('main.flag_listing', listing_id=listing.id) }}" method="post" class="auth-form">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <div class="form-group">
                <label for="reason">Reason (optional but helpful)</label>
                <textarea id="reason" name="reason" rows="4" placeholder="e.g. Spam, inappropriate content, wrong category..."></textarea>
            </div>
            <div style="display: flex; gap: 0.75rem; margin-top: 1rem;">
                <button type="submit" class="btn primary">Submit report</button>
                <a href="{{ url_for('main.view_listing', listing_id=listing.id) }}" class="btn ghost">Cancel</a>
            </div>
        </form>
    </main>
</body>
</html>
