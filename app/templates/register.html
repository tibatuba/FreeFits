<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - FreeFits</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <header>
        <h1><a href="{{ url_for('main.home') }}" style="text-decoration: none; color: inherit;">FreeFits</a></h1>
    </header>

    <main>
        <h2>Join FreeFits!</h2>
        <p class="subtitle">Create your account to start trading free clothing</p>
        
        {% if error %}
            <div class="error-message">{{ error }}</div>
        {% endif %}
        
        <form action="{{ url_for('main.register') }}" method="post">
            <label for="username">Username:</label>
            <input type="text" id="username" name="username" placeholder="Choose a username" required>

            <label for="email">Email:</label>
            <input type="email" id="email" name="email" placeholder="Enter your email" required>

            <label for="password">Password:</label>
            <input type="password" id="password" name="password" placeholder="Create a password" required>

            <label for="confirm_password">Confirm Password:</label>
            <input type="password" id="confirm_password" name="confirm_password" placeholder="Confirm your password" required>

            <label for="location">Location (City, State):</label>
            <input type="text" id="location" name="location" placeholder="e.g., Toronto, ON" required>

            <div class="wrap">
                <button type="submit">Create Account</button>
            </div>
        </form>

        <p>Already have an account?
            <a href="{{ url_for('main.login') }}" style="text-decoration: none;">Sign in here</a>
        </p>
    </main>

    <footer>
        &copy; 2025 FreeFits - Free Clothing Marketplace
    </footer>
</body>
</html>
